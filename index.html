<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Aviso da AGI - Assessoria de Gestão e Inovação sobre a mudança do número de WhatsApp.">
    <title>ATENÇÃO — Novo WhatsApp AGI</title>
    <style>
        * { box-sizing: border-box; }
        html, body { margin: 0; padding: 0; min-height: 100%; }
        body {
            background: #f2f4f7;
            font-family: Arial, Helvetica, sans-serif;
            color: #1f2937;
            text-align: center;
        }
        .container {
            width: 100%;
            max-width: 900px;
            margin: 0 auto;
            padding: 24px 16px 40px;
        }
        .aviso {
            display: block;
            width: 100%;
            height: auto;
            margin: 0 auto;
            background: #fff;
            border-radius: 8px;
            box-shadow: 0 3px 16px rgba(0,0,0,.12);
        }
        .botoes { margin-top: 20px; }
        .botao {
            display: inline-block;
            margin: 6px;
            padding: 12px 20px;
            border-radius: 6px;
            background: #0b4f9c;
            color: #fff;
            text-decoration: none;
            font-weight: bold;
        }
        .botao:hover { opacity: .9; }
        .rodape {
            margin-top: 18px;
            font-size: 13px;
            color: #6b7280;
        }
    </style>
</head>
<body>
    <main class="container">
        <img class="aviso"
             src="Placa_Whats_atendimentos.png"
             alt="Aviso AGI — mudança do número de WhatsApp">

        <div class="botoes">
            <a class="botao"
               href="aviso-whatsapp-2026.png"
               target="_blank"
               rel="noopener">
                Abrir imagem
            </a>
        </div>

        <div class="rodape">
            AGI — Assessoria de Gestão e Inovação · Prefeitura de Contagem
        </div>
    </main>
</body>
</html>
